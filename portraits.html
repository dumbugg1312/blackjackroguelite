<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Portrait gallery (dev)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Archivo:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<style>
  html, body { overflow: auto; }
  body { padding: 24px; }
  .grid { display: flex; flex-wrap: wrap; gap: 20px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 150px; }
  .cell .name { font-family: var(--font-body); font-size: 12px; color: var(--muted); text-align: center; }
  /* replica of the in-game .portrait frame */
  .portrait {
    width: 104px; height: 104px; border-radius: 4px;
    border: 1px solid var(--accent-deep); background: var(--surface);
    display: grid; place-items: center; position: relative; overflow: hidden;
    box-shadow: 0 0 34px oklch(0.78 0.13 85 / 0.22), 0 14px 34px rgba(0,0,0,0.72);
  }
  .portrait::after {
    content: ""; position: absolute; inset: 4px; border-radius: 2px; pointer-events: none;
    box-shadow: inset 0 0 0 1px oklch(0.55 0.09 85 / 0.28);
  }
  .portrait.boss { width: 124px; height: 124px; border-color: var(--accent); }
  .portrait.elite { border-color: var(--curse); }
  .portrait svg { width: 100%; height: 100%; }
  .big .portrait { width: 300px; height: 300px; }
  .big { width: 340px; }
  h2 { color: var(--ink); margin: 24px 0 12px; font-size: 1.1rem; }
</style>
</head>
<body>
<h2>In-game size</h2>
<div class="grid" id="small"></div>
<h2>3× zoom (craft check)</h2>
<div class="grid" id="big"></div>
<script type="module">
  import { ENEMIES, BOSSES } from './js/game/enemies.js';
  const defs = [...ENEMIES, ...Object.values(BOSSES)];
  const small = document.getElementById('small');
  const big = document.getElementById('big');
  for (const d of defs) {
    const cls = d.tier === 'boss' ? 'boss' : d.tier === 'elite' ? 'elite' : '';
    for (const [host, extra] of [[small, ''], [big, 'big']]) {
      const cell = document.createElement('div');
      cell.className = 'cell ' + extra;
      cell.innerHTML = `<div class="portrait ${cls}">${d.portrait()}</div><div class="name">${d.name}</div>`;
      host.appendChild(cell);
    }
  }
</script>
</body>
</html>
